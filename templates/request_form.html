{% extends "base.html" %}
{% block title %}Request blood — BloodLink{% endblock %}
{% block content %}
<h1>Post a blood request</h1>
<form class="card form" method="post">
  <label>Patient name <input type="text" name="patient_name" required></label>
  <label>Blood group needed
    <select name="blood_group" required>
      {% for g in blood_groups %}<option value="{{ g }}">{{ g }}</option>{% endfor %}
    </select>
  </label>
  <label>City <input type="text" name="city" required></label>
  <label>Hospital <input type="text" name="hospital" required></label>
  <label>Contact phone <input type="text" name="contact_phone" required></label>
  <label>Units needed <input type="number" name="units" value="1" min="1"></label>
  <button type="submit">Post request</button>
</form>
{% endblock %}
