<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}BloodLink{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <a class="brand" href="{{ url_for('index') }}">🩸 BloodLink</a>
    <nav>
      <a href="{{ url_for('index') }}">Find donors</a>
      <a href="{{ url_for('list_requests') }}">Blood requests</a>
      <a href="{{ url_for('new_donor') }}">Register as donor</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer>Prototype — demo data only. Always verify donor details by phone.</footer>
</body>
</html>
