# CodeRabbit configuration — https://docs.coderabbit.ai/reference/configuration
#
# CodeRabbit gives every PR an automatic AI first review (summary, walkthrough,
# and line-level comments), like the bot reviews on large open-source repos.
#
# ONE-TIME SETUP (repo owner): install the CodeRabbit GitHub App and select
# this repository: https://github.com/apps/coderabbitai
# This config file is read automatically once the app is installed.

language: "en-US"
tone_instructions: >-
  Be friendly and specific. This is a student-led open-source prototype built
  in public; many contributors are first-timers. Explain the "why" behind each
  suggestion, keep comments short, and never be condescending.
early_access: false
enable_free_tier: true

reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  high_level_summary_placeholder: "@coderabbitai summary"
  auto_title_instructions: ""
  poem: false
  review_status: true
  collapse_walkthrough: false
  sequence_diagrams: true
  assess_linked_issues: true
  related_issues: true
  related_prs: true
  suggested_labels: true
  suggested_reviewers: false
  in_progress_fortune: true
  abort_on_close: true
  disable_cache: false
  auto_review:
    enabled: true
    auto_incremental_review: true
    ignore_title_keywords: []
    labels: []
    drafts: false
    base_branches: []
  finishing_touches:
    docstrings:
      enabled: true
  pre_merge_checks:
    docstrings:
      mode: "warning"
      threshold: 80
    title:
      mode: "warning"
    linked_issues:
      mode: "warning"
    description:
      mode: "warning"

chat:
  art: false

knowledge_base:
  opt_out: false
  learnings:
    scope: "auto"
  issues:
    scope: "auto"
  jira:
    project_keys: []
  linear:
    project_keys: []
  pull_requests:
    scope: "auto"
  code_guidelines:
    enabled: true
    filePatterns:
      - "CONTRIBUTING.md"
      - "SECURITY.md"
      - "docs/ARCHITECTURE.md"

code_generation:
  docstrings:
    language: "en-US"

path_filters:
  - "!dist/**"
  - "!node_modules/**"
  - "!package-lock.json"
  - "!**/*.webp"
  - "!docs/screenshots/**"

path_instructions:
  - path: "lib/**"
    instructions: >-
      Business logic lives here, not in screens. Flag real personal data,
      hard-coded secrets, and any place a donor phone number could leak
      before that donor accepts a request.
  - path: "app/**"
    instructions: >-
      Expo Router screens. Check accessibility (labels, focus states,
      contrast) and that screens still work on demo data.
  - path: "functions/src/**"
    instructions: >-
      TypeScript Cloud Functions. Flag anything that would require a paid
      Firebase plan feature; this project is $0-budget, free tier only.
  - path: "components/motion/**"
    instructions: >-
      Physics-based motion. Every component must respect
      prefers-reduced-motion and stay subtle for stressed users.
